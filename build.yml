name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto Android
        run: |
          set -e
          mkdir -p build-app
          cd build-app
          mkdir -p app
          cat > app/build.gradle <<'@@END@@'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.tcards.widget'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tcards.widget'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          @@END@@
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'@@END@@'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="tcards widget"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".WebActivity"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"/>
                  <service android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating web widget"/>
                  </service>
              </application>
          </manifest>
          @@END@@
          mkdir -p app/src/main/java/com/tcards/widget
          cat > app/src/main/java/com/tcards/widget/MainActivity.java <<'@@END@@'
          package com.tcards.widget;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private TextView status;

              private Button btn(LinearLayout l, String t, View.OnClickListener c) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setOnClickListener(c);
                  l.addView(b);
                  return b;
              }

              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  int p = (int) (20 * getResources().getDisplayMetrics().density);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(p, p, p, p);

                  TextView t = new TextView(this);
                  t.setText("tcards widget\n\nO widget aparece flutuando sobre a tela, com fundo transparente. "
                          + "Use os botoes MOVER e REDIM. no proprio widget para posicionar. "
                          + "Para digitar, ative TECLADO no widget.");
                  t.setTextSize(16);
                  l.addView(t);

                  status = new TextView(this);
                  status.setPadding(0, p, 0, p);
                  l.addView(status);

                  btn(l, "1. Permitir exibir sobre outros apps", v -> {
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())));
                  });
                  btn(l, "2. Mostrar widget", v -> {
                      if (!Settings.canDrawOverlays(this)) { refresh(); return; }
                      if (Build.VERSION.SDK_INT >= 33 &&
                              checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != 0) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      }
                      startForegroundService(new Intent(this, OverlayService.class));
                  });
                  btn(l, "Parar widget", v -> {
                      startService(new Intent(this, OverlayService.class).setAction(OverlayService.ACTION_STOP));
                  });
                  btn(l, "Abrir tcards em tela cheia (importar/exportar backup)", v ->
                      startActivity(new Intent(this, WebActivity.class)));

                  ScrollView sv = new ScrollView(this);
                  sv.addView(l);
                  setContentView(sv);
              }

              @Override protected void onResume() { super.onResume(); refresh(); }

              private void refresh() {
                  status.setText(Settings.canDrawOverlays(this)
                          ? "Permissao de sobreposicao: OK"
                          : "Permissao de sobreposicao: FALTANDO (toque no botao 1)");
              }
          }
          @@END@@
          mkdir -p app/src/main/java/com/tcards/widget
          cat > app/src/main/java/com/tcards/widget/OverlayService.java <<'@@END@@'
          package com.tcards.widget;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class OverlayService extends Service {
              static final String ACTION_STOP = "com.tcards.widget.STOP";
              private static final String CH = "widget";

              private WindowManager wm;
              private WindowManager.LayoutParams lp;
              private FrameLayout root;
              private WebView web;
              private SharedPreferences sp;
              private boolean kb = false;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override public int onStartCommand(Intent i, int f, int id) {
                  if (i != null && ACTION_STOP.equals(i.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  startFg();
                  if (root == null) show();
                  return START_NOT_STICKY;
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private void startFg() {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(CH, "Widget", NotificationManager.IMPORTANCE_LOW));
                  PendingIntent stop = PendingIntent.getService(this, 0,
                          new Intent(this, OverlayService.class).setAction(ACTION_STOP),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  PendingIntent open = PendingIntent.getActivity(this, 1,
                          new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(this, CH)
                          .setContentTitle("tcards widget ativo")
                          .setContentText("Toque em Parar para fechar")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .setContentIntent(open)
                          .addAction(new Notification.Action.Builder(
                                  Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel),
                                  "Parar", stop).build())
                          .build();
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(1, n);
                  }
              }

              private TextView button(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(11);
                  t.setTextColor(0xFFFFFFFF);
                  t.setPadding(dp(8), dp(6), dp(8), dp(6));
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0x88000000);
                  g.setCornerRadius(dp(8));
                  t.setBackground(g);
                  return t;
              }

              private void show() {
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  sp = getSharedPreferences("w", 0);
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  int w = sp.getInt("w", Math.min(dm.widthPixels - dp(24), dp(360)));
                  int h = sp.getInt("h", Math.min(dm.heightPixels / 2, dp(480)));
                  lp = new WindowManager.LayoutParams(w, h,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                                  | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.x = sp.getInt("x", dp(12));
                  lp.y = sp.getInt("y", dp(120));
                  lp.softInputMode = WindowManager.LayoutParams.SOFT_INPUT_ADJUST_PAN;

                  root = new FrameLayout(this);
                  web = new WebView(this);
                  Web.setup(web, this, true);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  web.loadUrl(Web.URL + "?e=widget");

                  // barra de controles (canto superior direito)
                  LinearLayout bar = new LinearLayout(this);
                  bar.setAlpha(0.6f);
                  TextView move = button("MOVER");
                  final TextView key = button("TECLADO: OFF");
                  TextView close = button("FECHAR");
                  bar.addView(move);
                  bar.addView(key);
                  bar.addView(close);
                  FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-2, -2, Gravity.TOP | Gravity.END);
                  bp.setMargins(dp(4), dp(4), dp(4), dp(4));
                  root.addView(bar, bp);

                  TextView grip = button("REDIM.");
                  grip.setAlpha(0.6f);
                  FrameLayout.LayoutParams gp = new FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM | Gravity.END);
                  gp.setMargins(dp(4), dp(4), dp(4), dp(4));
                  root.addView(grip, gp);

                  move.setOnTouchListener(new Drag(false));
                  grip.setOnTouchListener(new Drag(true));
                  close.setOnClickListener(v -> stopSelf());
                  key.setOnClickListener(v -> {
                      kb = !kb;
                      if (kb) lp.flags &= ~WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                      else lp.flags |= WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                      key.setText(kb ? "TECLADO: ON" : "TECLADO: OFF");
                      wm.updateViewLayout(root, lp);
                      if (kb) web.requestFocus();
                  });

                  wm.addView(root, lp);
              }

              private final class Drag implements View.OnTouchListener {
                  private final boolean resize;
                  private float dx, dy;
                  private int sx, sy;

                  Drag(boolean resize) { this.resize = resize; }

                  @Override public boolean onTouch(View v, MotionEvent e) {
                      switch (e.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              dx = e.getRawX();
                              dy = e.getRawY();
                              sx = resize ? lp.width : lp.x;
                              sy = resize ? lp.height : lp.y;
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              int nx = sx + (int) (e.getRawX() - dx);
                              int ny = sy + (int) (e.getRawY() - dy);
                              if (resize) {
                                  lp.width = Math.max(dp(160), nx);
                                  lp.height = Math.max(dp(160), ny);
                              } else {
                                  lp.x = nx;
                                  lp.y = ny;
                              }
                              wm.updateViewLayout(root, lp);
                              return true;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              sp.edit().putInt("x", lp.x).putInt("y", lp.y)
                                      .putInt("w", lp.width).putInt("h", lp.height).apply();
                              return true;
                      }
                      return false;
                  }
              }

              @Override public void onDestroy() {
                  try { if (root != null) wm.removeView(root); } catch (Exception ignored) {}
                  if (web != null) web.destroy();
                  root = null;
                  super.onDestroy();
              }
          }
          @@END@@
          mkdir -p app/src/main/java/com/tcards/widget
          cat > app/src/main/java/com/tcards/widget/Web.java <<'@@END@@'
          package com.tcards.widget;

          import android.content.ContentValues;
          import android.content.Context;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.OutputStream;

          final class Web {
              static final String URL = "file:///android_asset/tcards.html";

              // Captura downloads "blob:" (backup) e envia para o Android salvar em Downloads.
              static final String SHIM =
                  "(function(){if(window.__tcs)return;window.__tcs=1;var m={},cu=URL.createObjectURL;"
                + "URL.createObjectURL=function(b){var u=cu.call(URL,b);m[u]=b;return u};"
                + "var oc=HTMLAnchorElement.prototype.click;"
                + "HTMLAnchorElement.prototype.click=function(){var b=m[this.href];"
                + "if(this.download&&b){var n=this.download,f=new FileReader();"
                + "f.onload=function(){var s=String(f.result);AndroidSave.save(n,b.type||'application/octet-stream',s.substring(s.indexOf(',')+1))};"
                + "f.readAsDataURL(b);return}return oc.apply(this,arguments)}})();";

              // Fundo transparente: o app ativa isso quando roda dentro de iframe; aqui forcamos.
              static final String EMB =
                  "document.documentElement.classList.add('emb');"
                + "var st=document.createElement('style');"
                + "st.textContent='html,body{background:transparent!important}';"
                + "document.head.appendChild(st);";

              static void setup(WebView w, final Context ctx, final boolean widget) {
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  w.setBackgroundColor(Color.TRANSPARENT);
                  w.addJavascriptInterface(new Saver(ctx), "AndroidSave");
                  w.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView v, String url) {
                          v.evaluateJavascript(SHIM + (widget ? EMB : ""), null);
                      }
                  });
              }

              static final class Saver {
                  private final Context c;
                  private final Handler h = new Handler(Looper.getMainLooper());
                  Saver(Context c) { this.c = c.getApplicationContext(); }

                  @JavascriptInterface
                  public void save(String name, String mime, String b64) {
                      String msg;
                      try {
                          byte[] data = Base64.decode(b64, Base64.DEFAULT);
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, mime);
                          v.put(MediaStore.Downloads.RELATIVE_PATH, "Download");
                          Uri u = c.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          OutputStream o = c.getContentResolver().openOutputStream(u);
                          o.write(data);
                          o.close();
                          msg = "Salvo em Downloads: " + name;
                      } catch (Exception e) {
                          msg = "Erro ao salvar: " + e.getMessage();
                      }
                      final String m = msg;
                      h.post(() -> Toast.makeText(c, m, Toast.LENGTH_LONG).show());
                  }
              }
          }
          @@END@@
          mkdir -p app/src/main/java/com/tcards/widget
          cat > app/src/main/java/com/tcards/widget/WebActivity.java <<'@@END@@'
          package com.tcards.widget;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          public class WebActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> pending;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  Web.setup(web, this, false);
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (pending != null) pending.onReceiveValue(null);
                          pending = cb;
                          try {
                              startActivityForResult(p.createIntent(), 7);
                          } catch (Exception e) {
                              pending = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  setContentView(web);
                  web.loadUrl(Web.URL);
              }

              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == 7 && pending != null) {
                      pending.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      pending = null;
                  }
              }

              @Override protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          @@END@@
          cat > build.gradle <<'@@END@@'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          @@END@@
          cat > gradle.properties <<'@@END@@'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          @@END@@
          cat > settings.gradle <<'@@END@@'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Widgetapp"
          include ':app'
          @@END@@

      - name: Copiar o HTML para dentro do app
        run: |
          set -e
          if [ -f tcards.html ]; then SRC=tcards.html; else SRC="$(ls -1 *.html | head -n 1)"; fi
          echo "Usando: $SRC"
          mkdir -p build-app/app/src/main/assets
          cp "$SRC" build-app/app/src/main/assets/tcards.html

      - name: Compilar
        working-directory: build-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp build-app/app/build/outputs/apk/debug/app-debug.apk tcards-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tcards-widget
          path: tcards-widget.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: tcards widget (build ${{ github.run_number }})
          files: tcards-widget.apk
